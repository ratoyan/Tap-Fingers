buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// The ads SDK (yandex-mobile-ads → com.yandex.android:mobileads) ships Kotlin
// metadata newer than this project's Kotlin 2.1.20 (bumping it breaks other
// native modules — gesture-handler, safe-area-context — with an internal
// compiler error), so instead we tell every Kotlin compile task to skip the
// metadata version check. 2.1.20 can then read the newer .kotlin_module files
// and the ads SDK links cleanly.
allprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            freeCompilerArgs.add("-Xskip-metadata-version-check")
        }
    }
}
